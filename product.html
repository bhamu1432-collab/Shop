<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="productDetail" class="product-page"></div>

<script>
const id = new URLSearchParams(window.location.search).get("id");

const products = {
  1: {
    name: "Birthday Decoration",
    img: "https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da",
    desc: "Beautiful birthday decoration setup.",
    price: "₹2999"
  },
  2: {
    name: "Wedding Anniversary",
    img: "https://images.unsplash.com/photo-1529636798458-92182e662485",
    desc: "Romantic decoration for anniversary.",
    price: "₹4999"
  }
};

const p = products[id];

document.getElementById("productDetail").innerHTML = `
  <h2>${p.name}</h2>
  <img src="${p.img}">
  <p>${p.desc}</p>
  <h3>${p.price}</h3>
  <a href="https://wa.me/919876543210" class="btn">Book Now</a>
`;
</script>

</body>
</html>
