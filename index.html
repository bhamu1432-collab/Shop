<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhagwan Decoration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Sidebar -->
<div id="sidebar" class="sidebar">
  <span class="close-btn" onclick="toggleSidebar()">✖</span>
  <a href="#">🏠 Home</a>
  <a href="#">🚩 Flags</a>
  <a href="#">🌸 Hanging</a>
  <a href="#">Buntings</a>
  <a href="#">🎉 Mala</a>
  <a href="#">🪟 Panels</a>
  <a href="#">🎈 Themes</a>
  <a href="#">📞 Contact</a>
</div>

<!-- Header -->
<div class="header">
  <span class="menu" onclick="toggleSidebar()">☰</span>
  <h2>Bhagwan Decoration</h2>
  <p>📍 Hyderabad</p>
</div>

<!-- Banner -->
<div class="banner">
  <h1>✨ Premium Decoration Services ✨</h1>

</div>

  </div>
  <div class="card">
    <img src="https://cdn-icons-png.flaticon.com/512/3468/3468379.png">
    <p>Flower</p>
  </div>
  <div class="card">
    <img src="https://cdn-icons-png.flaticon.com/512/1046/1046784.png">
    <p>Candles</p>
  </div>
  <div class="card">
    <img src="https://cdn-icons-png.flaticon.com/512/2920/2920244.png">
    <p>Backdrop</p>
  </div>
  <div class="card">
    <img src="https://cdn-icons-png.flaticon.com/512/869/869636.png">
    <p>Curtain</p>
  </div>
  <div class="card">
    <img src="https://cdn-icons-png.flaticon.com/512/992/992651.png">
    <p>LED</p>

</div>

<script src="script.js"></script>
